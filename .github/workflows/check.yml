# The check: what a script can decide from the repository alone. Formatting of the
# Markdown, and the repo's own conventions (scripts/check.mjs). Required in the
# main ruleset once it has run.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes prettier@3 --check "**/*.md"
      - run: node scripts/check.mjs
